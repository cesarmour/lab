<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Dobra dos IQs v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Montserrat:wght@300&display=swap">
<style>
:root{--bg:#1c262f;--fg:#fcfefe;--muted:#78909c;--ink:#1c262f;--font:"Urbanist",system-ui,sans-serif;--s:min(150px,20vw)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;min-height:100vh;overflow:hidden}
.scene{width:calc(var(--s)*3);height:calc(var(--s)*4.2);perspective:1600px;display:grid;place-items:center}
.cube{position:relative;width:var(--s);height:var(--s);transform-style:preserve-3d;transform:translateZ(calc(var(--s)*-.5))}
@keyframes spin{from{transform:translateZ(calc(var(--s)*-.5)) rotateX(-22deg) rotateY(0)}to{transform:translateZ(calc(var(--s)*-.5)) rotateX(-22deg) rotateY(360deg)}}
.f{position:absolute;left:0;top:0;width:var(--s);height:var(--s);background:var(--acc);display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;backface-visibility:visible}
.logo{width:72%;height:auto;color:#fff;--iq-accent:var(--ink);position:relative;z-index:1}
.front{--acc:#3397b9}
.top{--acc:#ff5528;top:calc(var(--s)*-1);transform-origin:50% 100%}
.right{--acc:#4cb050;left:var(--s);transform-origin:0 50%}
.bottom{--acc:#ea1e63;top:var(--s);transform-origin:50% 0}
.left{--acc:#fcfefe;left:calc(var(--s)*-1);transform-origin:100% 50%;flex-direction:column;gap:calc(var(--s)*.06)}
.left .wm{width:52%;height:auto;color:var(--ink);position:relative;z-index:1}
.left .tag{margin:0;font:300 calc(var(--s)*.07) "Montserrat",var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);position:relative;z-index:1}
.back{--acc:#2b3a47;top:calc(var(--s)*-1);transform-origin:50% 100%;flex-direction:column}
.back .wm{width:52%;height:auto;color:#fff;position:relative;z-index:1;transform:rotate(180deg)}
.cube{visibility:hidden}
.play .cube{visibility:visible;animation:spin 14s linear 3.4s infinite}
.play .top{animation:foldTop .7s cubic-bezier(.4,0,.2,1) 1s forwards}
.play .right{animation:foldRight .7s cubic-bezier(.4,0,.2,1) 1.35s forwards}
.play .bottom{animation:foldBottom .7s cubic-bezier(.4,0,.2,1) 1.7s forwards}
.play .left{animation:foldLeft .7s cubic-bezier(.4,0,.2,1) 2.05s forwards}
.play .back{animation:foldBack .7s cubic-bezier(.4,0,.2,1) 2.6s forwards}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes foldTop{to{transform:rotateX(90deg)}}
@keyframes foldRight{to{transform:rotateY(90deg)}}
@keyframes foldBottom{to{transform:rotateX(-90deg)}}
@keyframes foldLeft{to{transform:rotateY(-90deg)}}
@keyframes foldBack{to{transform:rotateX(90deg)}}
button{font:600 13px var(--font);letter-spacing:.06em;background:none;color:var(--fg);border:1.5px solid #2e3b47;border-radius:999px;padding:8px 20px;cursor:pointer}
button:hover{border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
