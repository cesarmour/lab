<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mapa de Cabos da Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: diagrama de fiação da esquerda (internet) para a direita (aparelhos); cada cabo sai da porta
   de onde sai de verdade. Abaixo, a mesma informação em lista, para etiquetar os cabos. */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --surface-2: #e7ecf3; --ink: #15202f; --ink-2: #56647b; --line: #d2dae6;
  --isp: #7a2bbf; --unifi: #1f6feb; --deco: #0b8f7e; --outro: #6b7688;
  --warn: #b45309; --bad: #c2362b; --ok: #17804a; --grade: #dfe5ee;
  --f-titulo: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dado: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219; --surface: #161d28; --surface-2: #1f2835; --ink: #e6ebf3; --ink-2: #98a6ba; --line: #2c3748;
    --isp: #bb8ff2; --unifi: #62a0ff; --deco: #3fd0bb; --outro: #8b96a8;
    --warn: #f0a44a; --bad: #ff7b6e; --ok: #4fd08a; --grade: #1a222e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1219; --surface: #161d28; --surface-2: #1f2835; --ink: #e6ebf3; --ink-2: #98a6ba; --line: #2c3748;
  --isp: #bb8ff2; --unifi: #62a0ff; --deco: #3fd0bb; --outro: #8b96a8;
  --warn: #f0a44a; --bad: #ff7b6e; --ok: #4fd08a; --grade: #1a222e; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-texto);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--unifi); outline-offset: 2px; }
.pagina { max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* cabeçalho */
.topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px; }
h1 { font: 700 26px/1.1 var(--f-titulo); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.numeros { display: flex; flex-wrap: wrap; gap: 6px 24px; font-variant-numeric: tabular-nums; }
.numeros div { display: flex; align-items: baseline; gap: 6px; color: var(--ink-2); }
.numeros b { font: 700 20px/1 var(--f-titulo); color: var(--ink); }

.aviso {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-radius: 6px;
  border: 1px solid var(--warn); color: var(--ink);
  background: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--warn) 9%, transparent) 10px 20px), var(--surface);
}
.aviso b { color: var(--warn); }

/* fontes de dados */
.fontes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.fonte { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; min-width: 0; }
.fonte .cor { grid-row: span 2; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c); }
.fonte b { font-weight: 600; }
.fonte .estado { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-left: 6px; }
.fonte .estado.ok { color: var(--ok); } .fonte .estado.falta { color: var(--warn); }
.fonte p { margin: 0; color: var(--ink-2); font-size: 13px; }

/* barra de controles */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.abas { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.abas button { border: 0; background: none; padding: 7px 14px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.abas button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.chave { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.chave input { width: 16px; height: 16px; accent-color: var(--unifi); margin: 0; }
.busca { flex: 1 1 180px; max-width: 280px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.botao { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.botao:hover { border-color: var(--ink-2); }
.botao.forte { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; padding: 9px 18px; }
.botao.forte:hover { opacity: .88; }
.botao:disabled { opacity: .6; cursor: progress; }

/* mapear */
.mapear { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.mp-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.mp-topo p { margin: 0; flex: 1 1 260px; min-width: 0; color: var(--ink-2); }
.mp-topo p b { color: var(--ink); font-weight: 600; }
.mp-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px 16px; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label { font-weight: 600; font-size: 13px; }
.campo input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); width: 100%; font-family: var(--f-dado); font-size: 13px; }
.campo small, .campo summary { color: var(--ink-2); font-size: 12.5px; }
.campo summary { cursor: pointer; }
.campo details > div { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.mp-registro { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.55 var(--f-dado); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.mp-registro .ruim { color: var(--bad); font-weight: 600; } .mp-registro .bom { color: var(--ok); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 12.5px; margin-left: auto; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.legenda svg { width: 30px; height: 8px; }
.legenda line { stroke: var(--ink-2); stroke-width: 2; }

/* área do mapa + painel */
.area { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
@media (min-width: 1000px) { .area.com-painel { grid-template-columns: minmax(0, 1fr) 340px; } .painel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }
@media (max-width: 999px) { .painel { order: -1; } }
.rolo { overflow: auto; border: 1px solid var(--line); border-radius: 8px; min-width: 0;
  background: radial-gradient(circle, var(--grade) 1.2px, transparent 1.3px) 0 0 / 18px 18px, var(--surface-2); }
.palco { position: relative; }
.palco svg.cabos { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.cabo { fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; opacity: .9; }
.cabo.m-wifi { stroke-dasharray: 1 6; stroke-width: 2.4; }
.cabo.m-fibra { stroke-width: 3.5; }
.cabo.m-desconhecido { stroke: var(--outro); stroke-dasharray: 1 6; stroke-width: 2.4; }
.cabo.deduzido.m-cabo { stroke-dasharray: 9 5; }
.cabo.hl { stroke-width: 4; opacity: 1; }
.palco.filtrando .cabo { opacity: .25; }

.no { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-align: left; padding: 0; display: block; }
.no.infra { box-shadow: 0 1px 2px rgb(10 20 40 / .08); }
.no:hover { border-color: var(--ink-2); }
.no.sel { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); }
.no.off { opacity: .55; }
.no.pend { background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--c) 10%, transparent) 8px 16px), var(--surface); border-style: dashed; border-color: var(--c); }
.no.grupo { border-style: dashed; background: transparent; }
.palco.filtrando .no:not(.achou) { opacity: .28; }
.r-isp { --c: var(--isp); } .r-unifi { --c: var(--unifi); } .r-deco { --c: var(--deco); } .r-outro { --c: var(--outro); }
.cab { display: flex; align-items: center; gap: 9px; padding: 0 10px 0 12px; height: 52px; min-width: 0; }
.no.folha .cab { height: 44px; }
.ic { flex: none; width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.no.folha .ic { width: 24px; height: 24px; }
.ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tit { min-width: 0; display: flex; flex-direction: column; }
.tit b { font: 600 13.5px/1.25 var(--f-texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no.folha .tit b { font-weight: 500; font-size: 13px; }
.tit small { font: 400 11.5px/1.3 var(--f-dado); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no .entra { position: absolute; left: -1px; transform: translate(-50%, -50%); top: 26px; }
.no.folha .entra { top: 22px; }
.saidas { border-top: 1px solid var(--line); padding-bottom: 8px; }
.saida { height: 24px; display: flex; align-items: center; gap: 6px; padding-left: 12px; position: relative; font-size: 12px; }
.saida .dest { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.saida .vel { font: 400 11px var(--f-dado); color: var(--ink-2); white-space: nowrap; }
.saida .vel.lento { color: var(--warn); font-weight: 600; }
.saida .poe { color: var(--warn); font-size: 11px; }
.saida .jack { margin-right: -1px; transform: translateX(50%); }
.jack { /* tomada RJ45: quadrado com a trava em cima */
  flex: none; min-width: 22px; height: 18px; padding: 0 4px; border-radius: 2px; display: inline-grid; place-items: center;
  font: 600 10.5px/1 var(--f-dado); background: var(--surface); color: var(--ink); border: 1.5px solid var(--c, var(--ink-2)); position: relative;
}
.jack::before { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 3px; transform: translateX(-50%); background: var(--c, var(--ink-2)); border-radius: 1px 1px 0 0; }
.jack.ar { border-radius: 9px; border-style: dotted; } .jack.ar::before { display: none; }
.jack.nsei { color: var(--ink-2); }
.livres { font: 400 11px/18px var(--f-dado); color: var(--ink-2); padding: 0 12px; border-top: 1px dashed var(--line); height: 18px; white-space: nowrap; overflow: hidden; }
.tag { font: 600 10px var(--f-texto); text-transform: uppercase; letter-spacing: .06em; color: var(--c); margin-left: 6px; }

/* painel de detalhe */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.painel header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.painel h2 { font: 700 18px/1.2 var(--f-titulo); margin: 0; overflow-wrap: anywhere; }
.painel .tipo { color: var(--c); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.painel h3 { font: 600 12px var(--f-texto); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 6px; }
.painel dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.painel dt { color: var(--ink-2); } .painel dd { margin: 0; font-family: var(--f-dado); font-size: 12.5px; overflow-wrap: anywhere; }
.painel p { margin: 0; } .nota { color: var(--ink-2); font-size: 13px; }
.fechar { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-2); padding: 2px 6px; }
.portas { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.portas td { padding: 4px 6px 4px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.portas td:first-child { width: 34px; } .portas .v { font-family: var(--f-dado); white-space: nowrap; color: var(--ink-2); }
.portas tr.livre td { color: var(--ink-2); }
.elo { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.elo:hover { text-decoration-color: currentColor; }

/* lista de cabos */
.tabela-rolo { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.cabos-t { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
.cabos-t th { text-align: left; font: 600 11.5px var(--f-texto); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 10px 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cabos-t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cabos-t tr:last-child td { border-bottom: 0; }
.cabos-t .n { font: 400 12px var(--f-dado); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cabos-t .v { font: 400 12px var(--f-dado); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cabos-t .rede { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cabos-t .rede i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.cabos-t input { width: 100%; min-width: 150px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.pilula { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
.pilula.ded { border-color: var(--warn); color: var(--warn); }
.vazio { padding: 28px 16px; text-align: center; color: var(--ink-2); }
textarea.csv { width: 100%; height: 140px; font: 12px var(--f-dado); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
@media (prefers-reduced-motion: no-preference) { .cabo, .no { transition: opacity .15s, stroke-width .15s; } }
</style>

</head>

<div class="pagina">
  <div class="topo">
    <div>
      <h1>Mapa de Cabos da Casa</h1>
      <p class="sub" id="sub"></p>
    </div>

    <button class="botao" id="copiar" hidden>Copiar como planilha</button>
    <div class="legenda" id="legenda"></div>
  </div>
  <div class="area" id="area">
    <div id="vista"></div>
    <aside class="painel" id="painel" hidden></aside>
  </div>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);

  const INFRA = new Set(["internet", "modem", "gateway", "switch", "ap", "deco", "semgerencia"]);
  const TIPO = { internet: "Internet", modem: "Modem da operadora", gateway: "Roteador", switch: "Switch", ap: "Ponto de acesso Wi-Fi", deco: "Deco", semgerencia: "Switch sem gerência", client: "Aparelho" };
  const REDE = { isp: "n246 (Vivo)", unifi: "UniFi", deco: "Deco", outro: "Outros" };
  const MEIO = { cabo: "Cabo", wifi: "Wi-Fi", fibra: "Fibra", desconhecido: "Não identificado" };
  const W = 236, GAPX = 92, HEAD = 52, ROW = 24, PADB = 8, FOOT = 18, LEAF = 44, VGAP = 10, PAD = 28;
  const ICONE = {

  };
  const WIFI = '<svg viewBox="0 0 12 10" width="12" height="10" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round"><path d="M1 3.5a7.5 7.5 0 0 1 10 0M3 5.8a4.5 4.5 0 0 1 6 0"/><circle cx="6" cy="8.3" r=".8" fill="currentColor" stroke="none"/></svg>';
  const ic = k => `<span class="ic"><svg viewBox="0 0 24 24">${ICONE[k] || ICONE.client}</svg></span>`;

  let guardado = {};
  try { guardado = JSON.parse(localStorage.getItem("mapa-cabos") || "{}"); } catch (e) {}
  const lembrar = () => { try { localStorage.setItem("mapa-cabos", JSON.stringify(guardado)); } catch (e) {} };
  guardado.etiquetas = guardado.etiquetas || {};

  const temReal = () => !!(REAL && REAL.nodes && REAL.nodes.length);
  const st = { exemplo: !temReal(), vista: "mapa", wifi: false, finais: true, sel: null, busca: "" };
  let D, nos, saidas, sobe;

  const vel = v => !v ? "" : v >= 1000 ? `${String(v / 1000).replace(".", ",")} Gb` : `${v} Mb`;
  const dataBr = s => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  const nomePorta = (p, l) => p == null || p === "" ? "" : /^\d+$/.test(String(p)) ? `porta ${p}` : String(p);
  const ordemPorta = l => (l.from_port == null ? 1e9 : Number(l.from_port) || 0);
  const eInfra = n => INFRA.has(n.kind) || saidas.has(n.id);
  const bate = n => { const q = st.busca.trim().toLowerCase(); return !q || [n.name, n.ip, n.mac, n.model, n.vendor].some(v => v && String(v).toLowerCase().includes(q)); };

  function carregar() {
    D = st.exemplo ? EXEMPLO : REAL;
    D = D || { nodes: [], links: [], fontes: {} };
    nos = new Map(D.nodes.map(n => [n.id, n]));
    saidas = new Map(); sobe = new Map();
    for (const l of D.links) { if (!saidas.has(l.from)) saidas.set(l.from, []); saidas.get(l.from).push(l); sobe.set(l.to, l); }
    if (st.sel && !st.sel.startsWith("grupo:") && !nos.has(st.sel)) st.sel = null;
  }

  // ───── cabeçalho, avisos, fontes ─────
  function desenharTopo() {
    const cabos = D.links.filter(l => l.medium === "cabo" || l.medium === "fibra");
    const ded = cabos.filter(l => l.certainty === "deduzido").length;
    const ap = D.nodes.filter(n => n.kind !== "internet" && n.kind !== "semgerencia").length;
    const semfio = D.links.filter(l => l.medium === "wifi").length;
    const redes = ["unifi", "deco"].filter(k => D.fontes && D.fontes[k] && D.fontes[k].ok).length;
    $("#sub").textContent = D.gerado_em ? `De onde sai e onde chega cada cabo. Montado em ${dataBr(D.gerado_em)}.` : "De onde sai e onde chega cada cabo.";
    $("#numeros").innerHTML = `<div><b>${cabos.length}</b> ${cabos.length === 1 ? "cabo" : "cabos"}${ded ? ` (${ded} ${ded === 1 ? "deduzido" : "deduzidos"})` : ""}</div><div><b>${semfio}</b> ${semfio === 1 ? "ligação" : "ligações"} Wi-Fi</div><div><b>${ap}</b> ${ap === 1 ? "aparelho" : "aparelhos"}</div><div><b>${redes}</b> de 2 redes coletadas</div>`;
    const f = D.fontes || {};
    const falta = ["unifi", "deco"].filter(k => !(f[k] && f[k].ok));
    let av = "";
    if (st.exemplo) av = `<div class="aviso"><span><b>Exemplo.</b> Esta é uma casa inventada, só para mostrar como o mapa fica. Não é a sua rede.</span>${temReal() ? '<button class="botao" id="trocar">Voltar para a minha rede</button>' : ""}</div>`;
    else if (falta.length) av = `<div class="aviso"><span><b>Falta coletar ${falta.map(k => REDE[k]).join(" e ")}.</b> Por enquanto o mapa só mostra quem está em cada rede, sem portas nem cabos.</span><button class="botao" id="trocar">Ver um exemplo completo</button></div>`;
    $("#aviso").innerHTML = av;
    const t = $("#trocar"); if (t) t.onclick = () => { st.exemplo = !st.exemplo; st.sel = null; tudo(); };
    const como = { unifi: "São dois consoles: 246 Network Server e Cloud Gateway Ultra. Uma chave do Site Manager lê os dois.", deco: "O Deco está na mesma rede do UniFi. Clique em Mapear e informe a senha dele.", local: "Clique em Mapear em qualquer rede." };
    const oque = { unifi: "Portas de cada switch, pontos de acesso e o que está em cada porta.", deco: "Unidades Deco, como se ligam entre si e os aparelhos de cada uma.", local: "Quem está na rede n246 (direto no modem Vivo) e na rede UniFi + Deco." };
    const rot = { unifi: "UniFi", deco: "Deco (mesma rede do UniFi)", local: "Varredura das duas redes" }, cor = { unifi: "unifi", deco: "deco", local: "isp" };
    $("#fontes").innerHTML = ["local", "unifi", "deco"].map(k => {
      const ok = f[k] && f[k].ok;
      const extra = ok && k === "unifi" && f[k].formato === "oficial" ? " A API usada não informa o número da porta." : "";
      return `<div class="fonte" style="--c:var(--${cor[k]})"><span class="cor"></span><div><b>${rot[k]}</b><span class="estado ${ok ? "ok" : "falta"}">${ok ? `coletado ${dataBr(f[k].quando)}` : "falta coletar"}</span></div><p>${ok ? oque[k] + extra : como[k]}</p></div>`;
    }).join("");
    $("#legenda").innerHTML = ["isp", "unifi", "deco"].map(r => `<span style="--c:var(--${r})"><i></i>${REDE[r]}</span>`).join("") +
      `<span><svg viewBox="0 0 30 8"><line x1="1" y1="4" x2="29" y2="4"/></svg>cabo</span>` +
      `<span><svg viewBox="0 0 30 8"><line x1="1" y1="4" x2="29" y2="4" stroke-dasharray="9 5"/></svg>cabo deduzido</span>` +
      `<span><svg viewBox="0 0 30 8"><line x1="1" y1="4" x2="29" y2="4" stroke-dasharray="1 6" stroke-linecap="round" style="stroke-width:2.4"/></svg>Wi-Fi</span>`;
  }

  // ───── mapa ─────
  function linhas(id) {
    const ls = saidas.get(id) || [];
    const nome = l => nos.get(l.to).name || "";
    const ord = (a, b) => ordemPorta(a) - ordemPorta(b) || nome(a).localeCompare(nome(b), "pt");
    const fio = ls.filter(l => l.medium !== "wifi").sort(ord), ar = ls.filter(l => l.medium === "wifi").sort(ord);
    const r = [];
    const inf = l => eInfra(nos.get(l.to));
    if (st.finais) fio.forEach(l => r.push({ l }));
    else { fio.filter(inf).forEach(l => r.push({ l })); const c = fio.filter(l => !inf(l)); if (c.length > 2) r.push({ grupo: "cabo", ls: c, de: id }); else c.forEach(l => r.push({ l })); }
    ar.filter(inf).forEach(l => r.push({ l }));
    const c = ar.filter(l => !inf(l));
    if (st.wifi || c.length <= 2) c.forEach(l => r.push({ l })); else r.push({ grupo: "wifi", ls: c, de: id });
    return r;
  }
  function medir(id, prof, vistos) {
    const n = nos.get(id), infra = eInfra(n), rs = vistos.has(id) ? [] : linhas(id);
    vistos.add(id);
    const hCard = infra ? HEAD + rs.length * ROW + (rs.length ? PADB : 0) + ((n.ports || []).length ? FOOT : 0) : LEAF;

      if (!EM_CASA && !mp.local) {
        const t = await fetch(API + "api/topologia", { cache: "no-store" }).then(x => x.json()).catch(() => null);
        if (t && t.nodes && t.nodes.length && (!REAL || !REAL.gerado_em || t.gerado_em > REAL.gerado_em)) { REAL = t; st.exemplo = false; tudo(); }
      }
      mp.local = true;
    } catch (e) { mp.local = false; $("#mp-status").innerHTML = FORA; }
    if (!mp.rodando) desenharMapear();
  }
  async function mapear() {
    const s = $("#mp-status"), b = $("#btn-mapear"), reg = $("#mp-registro");
    if (!mp.local) { s.innerHTML = FORA; return; }
    const segredos = {};
    $("#mp-campos").querySelectorAll("input").forEach(i => { if (i.value.trim()) segredos[i.id] = i.value.trim(); });
    mp.rodando = true; b.disabled = true; b.textContent = "Mapeando…"; s.textContent = "Varrendo a rede e consultando UniFi e Deco. Leva de 20 a 40 segundos."; reg.hidden = true;
    try {
      const r = await fetch(API + "api/mapear", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ segredos }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.erro || "falhou");
      REAL = j.topologia; mp.estado = j.estado; st.exemplo = false; st.sel = null;
      $("#mp-campos").querySelectorAll("input").forEach(i => i.value = "");
      reg.innerHTML = j.registro.map(l => `<div class="${/Falhou|falta|Erro|recus/i.test(l) ? "ruim" : /^\s+(UniFi|Deco): \d/.test(l) ? "bom" : ""}">${esc(l)}</div>`).join(""); reg.hidden = false;
      tudo();
    } catch (e) { reg.innerHTML = `<div class="ruim">Não deu para mapear: ${esc(e.message || e)}. O ajudante do Mapa de Cabos está rodando neste Mac?</div>`; reg.hidden = false; }
    mp.rodando = false; b.disabled = false; b.textContent = "Mapear esta rede"; desenharMapear();
  }
  $("#btn-mapear").onclick = mapear;
  $("#mp-campos").onsubmit = e => { e.preventDefault(); mapear(); };
  window.addEventListener("focus", () => { if (mp.local && !mp.rodando) lerEstado(); });
  tudo();
  lerEstado();
})();
</script>
