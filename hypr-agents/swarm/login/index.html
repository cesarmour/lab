<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C262F">
<title>Entrar · Swarm, by HYPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/hypr-agents/swarm/auth.js"></script>
<style>
:root{--bg:#1c262f;--ink:#fcfefe;--on-ink:#15202a;--lede:#dce3eb;--muted:#8a9aa5;--dim:#5e727d;--accent:#3397b9;--accent-bright:#56bbdc;--chip-bg:rgba(51,151,185,.14);--chip-ink:#8ccbe0;--line:rgba(252,254,254,.28);--mx:clamp(16px,6vw,96px);--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Urbanist,system-ui,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:dark}
.root{position:relative;min-height:100vh;min-height:100dvh;width:100%;overflow:hidden}
canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 80% at 72% 50%,transparent 40%,rgba(28,38,47,.35) 75%,var(--bg) 100%),linear-gradient(90deg,var(--bg) 0,rgba(28,38,47,.85) 28%,rgba(28,38,47,0) 55%)}
.top{position:absolute;z-index:3;top:28px;left:var(--mx);display:flex;align-items:center;gap:12px}
.top img{display:block;height:22px;width:auto}
.tag{padding:2px 8px;border-radius:6px;background:var(--chip-bg);color:var(--chip-ink);font-size:12px;font-weight:600;letter-spacing:.04em}
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;align-items:center;padding:96px var(--mx) 72px;pointer-events:none}
.copy{pointer-events:auto;width:min(720px,100%)}
.copy>*{animation:rise .8s var(--ease) both}.copy>:nth-child(2){animation-delay:.06s}.copy>:nth-child(3){animation-delay:.12s}.copy>:nth-child(4){animation-delay:.18s}.copy>:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{margin:0 0 22px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.live{width:6px;height:6px;border-radius:50%;background:var(--accent-bright);animation:live 2.4s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(86,187,220,.6)}70%{box-shadow:0 0 0 10px rgba(86,187,220,0)}100%{box-shadow:0 0 0 0 rgba(86,187,220,0)}}
h1{margin:0;font-size:clamp(40px,5.6vw,80px);line-height:.98;font-weight:400;letter-spacing:-.045em;color:var(--ink)}h1 em{font-style:normal;color:var(--accent)}
.lede{margin:30px 0 0;max-width:36ch;color:var(--lede);font-size:clamp(16px,1.5vw,20px);line-height:1.5}
.actions{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{height:48px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;margin:0;font:inherit;font-weight:600;font-size:14px;letter-spacing:.01em;cursor:pointer;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);transition:background .18s var(--ease),box-shadow .25s var(--ease),transform .18s var(--ease)}
.pill:hover:not(:disabled){background:#fff;box-shadow:0 8px 30px rgba(86,187,220,.22),0 0 0 4px rgba(252,254,254,.06)}
.pill:active:not(:disabled){transform:scale(.98)}.pill:disabled{opacity:.7;cursor:default}
.pill svg{width:16px;height:16px;flex:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(21,32,42,.2);border-top-color:var(--on-ink);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hint{margin:10px 0 0;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}.hint svg{width:13px;height:13px;flex:none}
.err{margin:16px 0 0;max-width:440px;font-size:13px;line-height:1.45;color:#ffd9da;background:rgba(177,28,31,.22);border:1px solid rgba(245,39,43,.4);border-radius:12px;padding:9px 12px}
.err a{color:#fff}
.hud{position:absolute;z-index:2;left:var(--mx);bottom:26px;display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;pointer-events:none}
.hud b{font-weight:500;color:var(--muted)}.hud .city{color:var(--chip-ink);transition:opacity .3s}
.lbl{position:absolute;z-index:2;pointer-events:none;transform:translate(10px,-50%);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--lede);background:rgba(28,38,47,.82);border:1px solid rgba(252,254,254,.14);border-radius:4px;padding:4px 8px;white-space:nowrap;opacity:0;transition:opacity .35s}
.lbl.on{opacity:1}.lbl span{color:var(--muted);margin-left:8px;letter-spacing:.04em;text-transform:none}
@media (max-width:720px){.top{top:20px}.wrap{align-items:flex-end;padding-top:40vh;padding-bottom:48px}h1{font-size:clamp(44px,13vw,64px)}.lede{margin-top:18px;font-size:16px}.actions{margin-top:26px;flex-direction:column;align-items:stretch}.pill{width:100%}.hint{justify-content:center}.hud,.lbl{display:none}.vig{background:linear-gradient(180deg,rgba(28,38,47,.1) 0,rgba(28,38,47,.1) 35%,var(--bg) 70%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="root">
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>
  <div class="vig" aria-hidden="true"></div>
  <div class="lbl" id="lbl" aria-hidden="true"></div>
  <header class="top"><img src="/hypr-agents/hypr-wordmark-white.svg" alt="HYPR"><span class="tag">Swarm</span></header>
  <main class="wrap"><section class="copy" aria-labelledby="h1">
    <p class="eyebrow"><span class="live" aria-hidden="true"></span>Inteligência do mundo físico</p>
    <h1 id="h1">IA que responde com<br>dado de <em>vendas</em>,<br>não com opinião.</h1>
    <p class="lede">Um orquestrador, investigadores em paralelo sobre os pipelines da HYPR e um auditor independente. Para o time da HYPR.</p>
    <div class="actions"><button class="pill" id="go" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Entrar com Google</span></button></div>
    <p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg> Restrito a contas @hypr.mobi</p>
    <div id="err" hidden></div>
  </section></main>
  <div class="hud" aria-hidden="true"><span>Mira</span><b id="coord">−15.7939 · −47.8828</b><span class="city" id="city">Brasília</span></div>
</div>

<script>
(function(){
  var P=new URLSearchParams(location.search);
  var NEXT=P.get('next')||'/hypr-agents/swarm/app/';
  if(!/^\/hypr-agents\//.test(NEXT))NEXT='/hypr-agents/swarm/app/';
  if(SwarmAuth.get()){location.replace(NEXT);return}
  var go=document.getElementById('go'),err=document.getElementById('err'),label=go.querySelector('span');
  var E=P.get('err');
  if(E){err.hidden=false;err.className='err';err.textContent=E==='domain'?'Restrito a contas @hypr.mobi. Você entrou com '+(P.get('who')||'outra conta')+'.':E==='access_denied'?'Login cancelado.':'Falha no login do Google ('+E+').'}
  go.onclick=function(){go.disabled=true;label.innerHTML='<span class="spin"></span>';SwarmAuth.signIn(location.origin+NEXT)};

  /* ---------- mapa pontilhado ---------- */
  var cv=document.getElementById('bg'),ctx=cv.getContext('2d'),lbl=document.getElementById('lbl');
  var CITIES=[['Brasília',-15.7939,-47.8828],['São Paulo',-23.5505,-46.6333],['Rio de Janeiro',-22.9068,-43.1729],['Recife',-8.0476,-34.877],['Manaus',-3.119,-60.0217],['Salvador',-12.9777,-38.5016],['Belo Horizonte',-19.9167,-43.9345],['Porto Alegre',-30.0346,-51.2177],['Fortaleza',-3.7319,-38.5267],['Curitiba',-25.4284,-49.2733],['Belém',-1.4558,-48.4902],['Goiânia',-16.6869,-49.2648]];
  var geo=null,W=0,H=0,dpr=1,dots=[],cities=[],t0=performance.now();
  function proj(lat,lon){var mob=W<720;var k=mob?W/34:H/31;return [ (mob?.5*W:.74*W)+(lon+52)*k*Math.cos(-15*Math.PI/180)*1.08, (mob?.36*H:.52*H)-(lat+10)*k ]}
  function build(){
    W=cv.clientWidth;H=cv.clientHeight;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!geo)return;
    var pBR=new Path2D(),pO=new Path2D();
    geo.BR.forEach(function(r){r.forEach(function(p,i){var q=proj(p[1],p[0]);i?pBR.lineTo(q[0],q[1]):pBR.moveTo(q[0],q[1])});pBR.closePath()});
    geo.o.forEach(function(r){r.forEach(function(p,i){var q=proj(p[1],p[0]);i?pO.lineTo(q[0],q[1]):pO.moveTo(q[0],q[1])});pO.closePath()});
    var step=W<720?8:9;dots=[];
    for(var y=step/2;y<H;y+=step)for(var x=step/2;x<W;x+=step){
      var inBR=ctx.isPointInPath(pBR,x,y),inO=!inBR&&ctx.isPointInPath(pO,x,y);
      if(!inBR&&!inO){if(Math.random()<.0025)dots.push({x:x,y:y,r:.8,a:.18,k:0,ph:Math.random()*6.3});continue}
      var h=Math.random();
      dots.push({x:x+(Math.random()-.5)*1.2,y:y+(Math.random()-.5)*1.2,r:inBR?(h<.06?2.1:h<.5?1.35:1.05):1.0,a:inBR?(h<.06?.9:.55+Math.random()*.3):.22+Math.random()*.1,k:inBR?(h<.06?2:h<.5?1:0):3,ph:Math.random()*6.3});
    }
    cities=CITIES.map(function(c){var q=proj(c[1],c[2]);return {n:c[0],lat:c[1],lon:c[2],x:q[0],y:q[1]}});
  }
  function draw(now){
    var t=(now-t0)/1000;ctx.clearRect(0,0,W,H);
    // halo
    var g=ctx.createRadialGradient(.72*W,.5*H,0,.72*W,.5*H,Math.max(W,H)*.55);g.addColorStop(0,'rgba(51,151,185,.10)');g.addColorStop(1,'rgba(51,151,185,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // orbit line
    ctx.strokeStyle='rgba(51,151,185,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(.42*W,-.1*H,.55*W,.95*H,0,0,Math.PI*2);ctx.stroke();
    for(var i=0;i<dots.length;i++){var d=dots[i];var a=d.a;if(d.k===2)a*=.7+.3*Math.sin(t*1.6+d.ph);
      ctx.fillStyle=d.k===2?'rgba(86,187,220,'+a+')':d.k===1?'rgba(200,228,240,'+a+')':d.k===3?'rgba(120,144,156,'+a+')':'rgba(252,254,254,'+a+')';
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.2832);ctx.fill()}
    // cidade em foco
    var ci=Math.floor(t/3.2)%cities.length,c=cities[ci],ph=(t%3.2)/3.2;
    ctx.strokeStyle='rgba(86,187,220,'+(.6*(1-ph))+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(c.x,c.y,4+ph*22,0,6.2832);ctx.stroke();
    ctx.fillStyle='rgba(86,187,220,.95)';ctx.beginPath();ctx.arc(c.x,c.y,2.6,0,6.2832);ctx.fill();
    if(lbl.dataset.i!=ci){lbl.dataset.i=ci;lbl.innerHTML=c.n+'<span>'+c.lat.toFixed(4)+' · '+c.lon.toFixed(4)+'</span>';lbl.style.left=c.x+'px';lbl.style.top=c.y+'px';lbl.style.transform=c.x>W-240?'translate(calc(-100% - 10px),-50%)':'translate(10px,-50%)';lbl.classList.add('on');document.getElementById('city').textContent=c.n;document.getElementById('coord').textContent=c.lat.toFixed(4).replace('-','−')+' · '+c.lon.toFixed(4).replace('-','−')}
    requestAnimationFrame(draw);
  }
  fetch('/hypr-agents/swarm/login/sa.json').then(function(r){return r.json()}).then(function(j){geo=j;build();requestAnimationFrame(draw)});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,120)});
  build();
})();
</script>
</body>
</html>
