<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C262F">
<title>Swarm · abrir caso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/hypr-agents/swarm/auth.js"></script>
<script src="/hypr-agents/swarm/app/live.js"></script>
<script>var USER=SwarmAuth.require();if(!USER)document.documentElement.style.visibility='hidden';</script>
<style>
:root{--midnight:#1C262F;--cloud:#FAFAFA;--off:#FCFEFE;--mist:#E5EBF2;--steel:#78909C;--slate:#536872;--cyan:#3397B9;--deep:#246C84;--soft:#C5EAF6;--good:#018376;--good-bg:#E6F3EA;--bad:#B41048;--bad-bg:#FBE4EA;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--shadow:0 8px 28px rgba(28,38,47,.06),0 1px 2px rgba(28,38,47,.04)}
*{box-sizing:border-box}html,body{margin:0;background:var(--cloud);color:var(--midnight);font-family:Urbanist,system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.cover{background:var(--midnight);color:var(--off);padding:0 20px}.cover .in{max-width:1080px;margin:0 auto;padding:28px 0 32px}
.cover .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.cover .top a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(252,254,254,.7);text-decoration:none;border:1px solid rgba(252,254,254,.3);border-radius:999px;padding:6px 14px}
.cover .wm{height:17px;width:auto;display:block}
.cover .right{display:flex;align-items:center;gap:14px}
.usr{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:999px;background:rgba(10,15,20,.3);border:1px solid rgba(252,254,254,.1);font-size:13px;color:rgba(252,254,254,.85)}
.usr img,.usr .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(86,187,220,.35),rgba(51,151,185,.15));color:#d6f1fa;font-size:10px;font-weight:700}
.usr .em{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button{background:none;border:0;padding:2px 8px;font:inherit;font-size:12px;font-weight:600;color:rgba(252,254,254,.6);cursor:pointer;border-radius:999px}.usr button:hover{color:#fff;background:rgba(252,254,254,.08)}
@media (max-width:600px){.usr .em{display:none}}
.cover h1{font-weight:300;font-size:clamp(30px,4.6vw,48px);line-height:1.08;letter-spacing:-.015em;margin:0}.cover h1 em{font-style:normal;color:var(--cyan)}
.cover p{color:rgba(252,254,254,.72);margin:10px 0 0;font-weight:300;max-width:56ch}
.page{max-width:1080px;margin:0 auto;padding:24px 20px 80px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--off);border:1px solid var(--mist);border-radius:20px;padding:22px 22px;box-shadow:var(--shadow)}
h2{margin:0 0 14px;font-size:22px;font-weight:300}
label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--midnight);background:var(--cloud);border:1px solid var(--mist);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--cyan)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{appearance:none;border:0;font:inherit;font-weight:600;font-size:16px;padding:13px 22px;border-radius:999px;cursor:pointer}
.primary{background:var(--midnight);color:var(--off);width:100%;margin-top:18px}.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--slate);border:1px solid var(--mist);padding:8px 14px;font-size:14px}
.hint{font-size:13.5px;color:var(--steel);margin:8px 0 0}
.cb{position:relative}.cb .hint{min-height:1.2em;font-size:12.5px;margin-top:6px}
.dd{position:absolute;z-index:5;left:0;width:max(100%,460px);max-width:calc(100vw - 60px);top:calc(100% - 24px);background:var(--off);border:1px solid var(--mist);border-radius:12px;box-shadow:0 12px 32px rgba(28,38,47,.12);max-height:280px;overflow:auto;padding:6px}
.dd div{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:15px}.dd div:hover,.dd div.on{background:var(--cloud)}
.dd b{font-weight:600}.dd span{font-family:var(--mono);font-size:10.5px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;gap:8px}
.cardq{background:var(--cloud);border:1px solid var(--mist);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:14.5px;line-height:1.35;color:var(--midnight);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;opacity:0;animation:cin .45s ease forwards}
.cardq:hover{border-color:var(--cyan);background:var(--off)}.cardq span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--deep);background:var(--soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.cardq.out{animation:cout .35s ease forwards}
@keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes cout{to{opacity:0;transform:translateY(-6px)}}
.msg{margin-top:12px;font-size:14.5px;padding:10px 14px;border-radius:10px;background:var(--good-bg);color:var(--good)}.msg.err{background:var(--bad-bg);color:var(--bad)}
.list{list-style:none;margin:0;padding:0}.list li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--mist);cursor:pointer}.list li:first-child{border-top:0}
.list .t{font-size:15.5px}.list .s{font-family:var(--mono);font-size:10.5px;color:var(--steel);letter-spacing:.04em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.run{background:var(--soft);color:var(--deep)}.pill.no{background:var(--bad-bg);color:var(--bad)}.pill.q{background:var(--mist);color:var(--slate)}
.full{grid-column:1/-1}
.hyp{display:grid;grid-template-columns:40px 1fr 100px;gap:14px;padding:16px 0;border-top:1px solid var(--mist)}.hyp:first-child{border-top:0;padding-top:0}
.rank{font-weight:300;font-size:30px;line-height:1;color:var(--cyan)}.st{margin:0;font-size:17px;font-weight:600}.ev{margin:6px 0 0;color:var(--slate);font-size:15px}.an{margin:6px 0 0;color:var(--deep);font-size:14px}
.conf{text-align:right}.conf .v{font-weight:300;font-size:28px;line-height:1;color:var(--good)}.conf .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}.conf .w{font-size:12.5px;color:var(--slate);margin-top:4px}
.action{background:var(--midnight);color:var(--off);border-radius:16px;padding:18px 22px;margin-top:16px}.action p{margin:6px 0 0;font-weight:300;font-size:17px}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 16px}.kpi .v{font-weight:300;font-size:28px;line-height:1}.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-top:4px}
details{border-top:1px solid var(--mist);padding:8px 0}summary{cursor:pointer;font-size:14.5px;color:var(--slate)}pre{margin:8px 0;padding:10px 12px;background:var(--cloud);border:1px solid var(--mist);border-radius:8px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--slate)}
.dis{margin:0;padding-left:18px;color:var(--slate);font-size:14.5px}
.audit li{list-style:none;padding:8px 0 8px 24px;position:relative;color:var(--slate);border-top:1px solid var(--mist);font-size:14.5px}.audit li::before{position:absolute;left:0;font-family:var(--mono)}.audit li.ok::before{content:"✓";color:var(--good)}.audit li.no::before{content:"✕";color:var(--bad)}.audit ul{padding:0;margin:0}
@media (max-width:860px){.page{grid-template-columns:1fr}.hyp{grid-template-columns:32px 1fr}.conf{text-align:left;grid-column:2}}

/* execução ao vivo (mesmo visual da simulação) */
#live{padding:0;overflow:hidden}
.lv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 22px 0}
.lv-head h2{font-size:20px}
#live .kpis{padding:0 22px;margin:10px 0 6px}
.net{padding:8px 14px 0}.net svg{width:100%;height:auto;display:block}
.net text{font-family:Urbanist,system-ui,sans-serif;fill:var(--slate);font-size:12px;font-weight:600}
.net text.sub{font-family:var(--mono);fill:var(--steel);font-size:9px;font-weight:400;letter-spacing:.04em}
.net text.role{fill:var(--steel);font-size:10.5px;font-weight:400}
.net text.bq{font-family:var(--mono);fill:var(--steel);font-size:9.5px;letter-spacing:.08em}
.net text.tn{font-family:var(--mono);fill:var(--slate);font-size:9px;font-weight:500;letter-spacing:.02em}
.net .bqbox{fill:var(--cloud);stroke:var(--mist)}
.net .pipe rect{fill:var(--midnight)}
.net text.pn{font-family:var(--mono);fill:var(--off);font-size:10px;font-weight:500;letter-spacing:.04em}
.net text.ps{fill:var(--steel);font-size:9.5px;font-weight:400}
.net .feed{stroke:var(--mist);stroke-width:1;fill:none}
.net .drop{fill:var(--cyan);opacity:.8}
.net .link{stroke:var(--mist);stroke-width:1.2;fill:none;transition:stroke .3s,stroke-width .3s}
.net .link.on{stroke:var(--cyan);stroke-width:1.6;stroke-dasharray:3 5;animation:flow .6s linear infinite}
.net .base circle{fill:var(--off);stroke:var(--mist);stroke-width:1.5;transition:stroke .3s,fill .3s}
.net .base.on circle{stroke:var(--cyan);fill:var(--soft)}
.net .base .ring{fill:none;stroke:var(--cyan);stroke-width:1;opacity:0;transform-origin:center;transform-box:fill-box}
.net .base.on .ring{animation:ring .9s ease-out}
.net .base .cnt{font-family:var(--mono);fill:var(--deep);font-size:10.5px;font-weight:500}
.net .ag circle.c{fill:var(--off);stroke:var(--mist);stroke-width:1.5;transition:stroke .3s,fill .3s}
.net .ag.live circle.c{stroke:var(--soft)}
.net .ag.done circle.c{stroke:var(--good);fill:var(--good-bg)}
.net .ag .st{font-family:var(--mono);font-size:9px;fill:var(--steel);letter-spacing:.04em}
.net .ag.live .st{fill:var(--cyan)}.net .ag.done .st{fill:var(--good)}
.net .ag .prog{stroke:var(--cyan);stroke-width:2.5;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.net .ag.done .prog{stroke:var(--good)}
.net .ag.born{animation:born .6s ease-out}
.net .pkt{fill:var(--cyan)}.net .pkt.back{fill:var(--deep)}
.console{height:300px;overflow-y:auto;scroll-behavior:smooth;padding:10px 20px 14px;font-size:13px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--mist);background:var(--cloud)}
.ln{display:grid;grid-template-columns:3.4em 7.5em 1fr;gap:10px;align-items:baseline;opacity:0;animation:in .3s ease forwards;color:var(--slate)}
.ln .m{font-family:var(--mono);font-size:10.5px;color:var(--steel)}
.ln .who{font-weight:600;color:var(--midnight);white-space:nowrap;font-size:12.5px}
.ln.orq .who,.ln.aud .who{color:var(--deep)}
.ln pre{margin:4px 0 2px;padding:8px 12px;background:var(--off);border:1px solid var(--mist);border-radius:8px;font-family:var(--mono);font-size:10.5px;line-height:1.5;color:var(--slate);white-space:pre-wrap;overflow:hidden}
.ln pre .k{color:var(--deep)}.ln pre .s{color:var(--cyan)}
.ln .res{font-family:var(--mono);font-size:10.5px;color:var(--steel)}
.ln.hyp{color:var(--steel);font-style:italic}.ln.dead{color:var(--bad)}.ln.find{color:var(--midnight)}.ln.find .who{color:var(--good)}
#lv-foot{padding:0 22px 22px}#lv-foot:empty{padding:0}
@keyframes in{to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-8}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
@keyframes born{from{opacity:0}to{opacity:1}}
@media (max-width:600px){.ln{grid-template-columns:3.2em 1fr}.ln .who{grid-column:2}.ln>div{grid-column:2}}
@media (prefers-reduced-motion:reduce){.net .drop{display:none}.ln{animation:none;opacity:1}.net .link.on,.net .base.on .ring{animation:none}}
</style>
</head>
<body>
<section class="cover"><div class="in">
<div class="top"><div><a href="/hypr-agents/swarm/">← conceito</a> <a href="/hypr-agents/swarm/playbooks/">playbooks</a></div><div class="right"><span class="usr" id="who"></span><img class="wm" src="/hypr-agents/hypr-wordmark-white.svg" alt="HYPR"></div></div>
<h1>Swarm<em>.</em> Abrir um caso.</h1>
<p>Uma pergunta, uma marca, um período. O orquestrador cria os investigadores, o auditor confere, e o resultado aparece aqui com hipóteses e confiança.</p>
</div></section>

<div class="page">
  <div class="card">
    <h2>Novo caso</h2>
    <form id="f">
      <label>Pergunta</label><textarea id="q" required placeholder="Por que as vendas da Monster caíram 12,5% em junho?"></textarea>
      <div class="row"><div class="cb"><label>Marca</label><input id="brand" required placeholder="buscar marca…" autocomplete="off"><div class="dd" id="dd" hidden></div><div class="hint" id="bmeta"></div></div><div><label>Playbook</label><select id="pb"><option value="">carregando…</option></select></div></div>
      <div id="sug" hidden><label>Sugestões para a marca</label><div class="cards" id="cards"></div></div>
      <div class="row"><div><label>De</label><input id="from" type="date" required></div><div><label>Até</label><input id="to" type="date" required></div></div>
      <button class="primary" id="go" type="submit">Abrir caso</button>
      <div id="m"></div>
    </form>
  </div>

  <div class="card">
    <h2>Rodando agora</h2>
    <ul class="list" id="runs"><li><span class="t">…</span></li></ul>
    <h2 style="margin-top:22px">Casos concluídos</h2>
    <ul class="list" id="cases"><li><span class="t">…</span></li></ul>
  </div>

  <div class="card full" id="live" hidden></div>
  <div class="card full" id="view" hidden></div>
</div>

<script>
(function(){
  var API='https://swarm-453955675457.us-central1.run.app';
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function say(t,err){$('m').innerHTML='<div class="msg'+(err?' err':'')+'">'+t+'</div>'}
  function fmtTok(n){return n>=1000?(n/1000).toFixed(0)+' mil':n}
  function gb(b){return b>=1e9?(b/1e9).toFixed(1)+' GB':Math.round(b/1e6)+' MB'}
  async function api(path,opt){opt=opt||{};var s=SwarmAuth.get();if(!s){SwarmAuth.require();throw new Error('sem sessão')}
    opt.headers=Object.assign({'Authorization':'Bearer '+s.id_token,'Content-Type':'application/json'},opt.headers||{});
    var r=await fetch(API+path,opt);
    if(r.status===401){SwarmAuth.clear();SwarmAuth.require();throw new Error('sessão vencida')}
    return r}

  if(USER){var ini=(USER.name||USER.email).trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase();
    $('who').innerHTML=(USER.picture?'<img src="'+esc(USER.picture)+'" alt="" referrerpolicy="no-referrer">':'<span class="av">'+esc(ini)+'</span>')+'<span class="em">'+esc(USER.email)+'</span><button type="button" id="out">sair</button>';
    $('out').onclick=function(){SwarmAuth.signOut()}}

  // playbooks
  var PLAYBOOKS=['queda-de-venda','movimento-concorrente','ruptura','sazonalidade-e-calendario','lancamento-expansao','performance-por-rede','mix-de-portfolio','canibalizacao','elasticidade','avaliacao-de-campanha','cesta-e-ocasiao','fidelidade-e-churn'];
  var NAMES={'queda-de-venda':'queda de venda','movimento-concorrente':'movimento concorrente','ruptura':'ruptura','sazonalidade-e-calendario':'sazonalidade e calendário','lancamento-expansao':'lançamento ou expansão','performance-por-rede':'performance por rede','mix-de-portfolio':'mix de portfólio','canibalizacao':'canibalização','elasticidade':'elasticidade','avaliacao-de-campanha':'avaliação de campanha','cesta-e-ocasiao':'cesta e ocasião','fidelidade-e-churn':'fidelidade e churn'};
  var WANT=new URLSearchParams(location.search).get('playbook')||'queda-de-venda';
  function renderPlaybooks(list){$('pb').innerHTML=list.map(function(p){var slug=p.slug||p,t=p.title||NAMES[slug]||slug.replace(/-/g,' ');return '<option value="'+slug+'"'+(slug===WANT?' selected':'')+'>'+esc(t.toLowerCase())+'</option>'}).join('')+'<option value="">sem playbook (hipóteses do zero)</option>'}
  async function loadPlaybooks(){renderPlaybooks(PLAYBOOKS);try{var r=await api('/playbooks');var l=await r.json();if(Array.isArray(l)&&l.length)renderPlaybooks(l)}catch(e){}}

  // ---- marcas (do BigQuery, via serviço) ----
  var BRANDS=[],BRAND=null,dd=$('dd'),bi=$('brand'),sel=-1;
  function money(v){return v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':v>=1e3?Math.round(v/1e3)+' mil':Math.round(v)}
  function nice(m){return m.toLowerCase().replace(/(^|\s)(\S)/g,function(a,b,c){return b+c.toUpperCase()})}
  function pct(a,b){return b?((a-b)/b*100):0}
  function fmtPct(p){return Math.abs(p).toFixed(1).replace('.',',')+'%'}
  async function loadBrands(){try{var r=await api('/brands');BRANDS=await r.json();bi.placeholder='buscar entre '+BRANDS.length+' marcas…';var w=new URLSearchParams(location.search).get('brand');if(w){var b=BRANDS.filter(function(x){return x.marca===w.toUpperCase()})[0];if(b)pick(b)}}catch(e){bi.placeholder='MONSTER (digite como na base)'}}
  function filterBrands(q){q=q.trim().toUpperCase();if(!q)return BRANDS.slice(0,12);var st=BRANDS.filter(function(b){return b.marca.indexOf(q)===0}),inn=BRANDS.filter(function(b){return b.marca.indexOf(q)>0||(b.categoria||'').toUpperCase().indexOf(q)>=0});return st.concat(inn).slice(0,12)}
  function showDD(list){sel=-1;if(!list.length){dd.hidden=true;return}dd.innerHTML=list.map(function(b,i){return '<div data-i="'+i+'"><b>'+esc(b.marca)+'</b><span>'+esc(b.categoria||'')+' · R$ '+money(b.jun)+'/mês · '+b.lojas+' lojas</span></div>'}).join('');dd.hidden=false;dd._list=list;
    dd.querySelectorAll('div[data-i]').forEach(function(d){d.onmousedown=function(ev){ev.preventDefault();pick(list[+d.dataset.i])}})}
  function norm(b){ // variação da marca descontada a variação da base (coleta), em %
    var d=pct(b.jun,b.mai),dj=pct(b.jul,b.jun),bd=b.base_mai?pct(b.base_jun,b.base_mai):0,bdj=b.base_jun?pct(b.base_jul,b.base_jun):0;
    return {d:d,dj:dj,bd:bd,bdj:bdj,n:b.base_mai?((1+d/100)/(1+bd/100)-1)*100:d,nj:b.base_jun?((1+dj/100)/(1+bdj/100)-1)*100:dj}}
  function sg(v){return (v>=0?'+':'−')+fmtPct(v)}
  function pick(b){BRAND=b;bi.value=b.marca;dd.hidden=true;var v=norm(b);
    $('bmeta').innerHTML=esc(b.categoria||'')+' · mai R$ '+money(b.mai)+' · jun R$ '+money(b.jun)+' ('+sg(v.d)+' bruto; base '+sg(v.bd)+'; <b>'+sg(v.n)+' normalizado</b>) · jul R$ '+money(b.jul)+' ('+sg(v.nj)+' norm.)';suggest(b)}
  bi.oninput=function(){BRAND=null;$('bmeta').textContent='';showDD(filterBrands(bi.value))};
  bi.onfocus=function(){if(BRANDS.length)showDD(filterBrands(bi.value))};
  bi.onblur=function(){setTimeout(function(){dd.hidden=true;if(!BRAND&&bi.value){var ex=BRANDS.filter(function(b){return b.marca===bi.value.trim().toUpperCase()})[0];if(ex)pick(ex);else bi.value=bi.value.toUpperCase()}},150)};
  bi.onkeydown=function(ev){if(dd.hidden)return;var items=dd.querySelectorAll('div[data-i]');if(ev.key==='ArrowDown'){sel=Math.min(items.length-1,sel+1)}else if(ev.key==='ArrowUp'){sel=Math.max(0,sel-1)}else if(ev.key==='Enter'){ev.preventDefault();if(sel>=0)pick(dd._list[sel]);else if(dd._list.length)pick(dd._list[0]);return}else return;items.forEach(function(d,i){d.classList.toggle('on',i===sel)})};

  // ---- sugestões de pergunta por marca ----
  var SUGS=[],sugI=0,sugT=null;
  function suggest(b){
    var B=nice(b.marca),cat=(b.categoria||'a categoria').toLowerCase(),v=norm(b),d=v.n,dj=v.nj,mov=d<0?'queda':'alta';
    SUGS=[];
    if(d<=-2)SUGS.push(['Por que a '+B+' caiu '+fmtPct(d)+' além da base em junho ('+sg(v.d)+' bruto, base '+sg(v.bd)+')?','queda-de-venda','2026-05-01:2026-06-30']);
    else if(d>=2)SUGS.push(['O que explica a '+B+' crescer '+fmtPct(d)+' acima da base em junho ('+sg(v.d)+' bruto, base '+sg(v.bd)+')?','queda-de-venda','2026-05-01:2026-06-30']);
    else SUGS.push(['A '+B+' variou '+sg(v.d)+' em junho, mas a base '+sg(v.bd)+'. Descontada a coleta, sobra algo ('+sg(d)+')?','queda-de-venda','2026-05-01:2026-06-30']);
    if(Math.abs(dj)>=3)SUGS.push([(dj>0?'A '+B+' subiu '+fmtPct(dj)+' acima da base em julho. O que mudou?':'A '+B+' caiu '+fmtPct(dj)+' além da base em julho. É tendência?'),'queda-de-venda','2026-06-01:2026-07-31']);
    SUGS.push(['A '+B+' perdeu distribuição ou teve ruptura em junho?','ruptura','2026-05-01:2026-06-30']);
    SUGS.push([d<0?'Quem ganhou o share que a '+B+' perdeu em '+cat+'?':'De quem a '+B+' tirou share em '+cat+'?','movimento-concorrente','2026-05-01:2026-06-30']);
    SUGS.push(['Quais redes concentram a '+mov+' da '+B+'?','performance-por-rede','2026-05-01:2026-06-30']);
    SUGS.push(['Qual a elasticidade de preço da '+B+' e onde há espaço para subir?','elasticidade','2026-02-01:2026-07-31']);
    SUGS.push(['Há canibalização dentro do portfólio da '+B+'?','canibalizacao','2026-03-01:2026-07-31']);
    SUGS.push(['Quanto do movimento da '+B+' em junho é coleta, calendário e sazonalidade?','sazonalidade-e-calendario','2026-05-01:2026-06-30']);
    SUGS.push(['Com o que a '+B+' vai junto na cesta e em que ocasião?','cesta-e-ocasiao','2026-05-01:2026-06-30']);
    SUGS.push(['A '+B+' está ganhando ou perdendo lojas fiéis?','fidelidade-e-churn','2026-02-01:2026-07-31']);
    SUGS.push(['Qual embalagem ou SKU está puxando a '+B+' em '+cat+'?','mix-de-portfolio','2026-05-01:2026-06-30']);
    sugI=0;$('sug').hidden=false;renderSugs(true);clearInterval(sugT);sugT=setInterval(function(){sugI=(sugI+3)%SUGS.length;renderSugs(false)},7000);
  }
  function renderSugs(first){
    var c=$('cards'),show=[0,1,2].map(function(k){return SUGS[(sugI+k)%SUGS.length]});
    var draw=function(){c.innerHTML=show.map(function(sg){return '<div class="cardq" title="usar esta pergunta">'+esc(sg[0])+'<span>'+esc(NAMES[sg[1]]||sg[1])+'</span></div>'}).join('');
      c.querySelectorAll('.cardq').forEach(function(d,i){d.onclick=function(){var sg=show[i];$('q').value=sg[0];$('pb').value=sg[1];var p=sg[2].split(':');$('from').value=p[0];$('to').value=p[1];clearInterval(sugT);$('q').focus()}})};
    if(first||!c.children.length)draw();else{c.querySelectorAll('.cardq').forEach(function(d){d.classList.add('out')});setTimeout(draw,330)}
  }

  // abrir caso
  $('f').onsubmit=async function(ev){ev.preventDefault();
    if(BRANDS.length&&!BRAND){say('Escolha uma marca da lista.',1);bi.focus();return}
    $('go').disabled=true;say('Abrindo o caso…');
    try{var r=await api('/cases',{method:'POST',body:JSON.stringify({question:$('q').value.trim(),brand:$('brand').value.trim(),period:$('from').value+':'+$('to').value,playbook:$('pb').value})});
      var j=await r.json();
      if(r.status===202){say('Caso '+j.id+' aberto. Acompanhe abaixo; o resultado leva de 3 a 10 minutos.');followId(j.id);loadRuns()}else say('Falhou: '+esc(j.error||r.status),1);
    }catch(e){say('Não consegui falar com o serviço: '+esc(e.message),1)}
    $('go').disabled=false;
  };

  // rodando agora
  var FOLLOWING=null,live=null;
  async function loadRuns(){
    var ul=$('runs');
    try{var r=await api('/runs');var l=await r.json();
      if(!l.length){ul.innerHTML='<li><span class="t">Nenhum caso rodando.</span></li>'}
      else ul.innerHTML=l.map(function(c){return '<li data-id="'+c.id+'"><div><div class="t">'+esc(c.question)+'</div><div class="s">'+esc(c.brand)+' · '+esc(c.period)+(c.opened_by?' · '+esc(c.opened_by):'')+'</div></div><span class="pill run">'+Math.round(c.seconds/60)+' min</span></li>'}).join('');
      ul.querySelectorAll('li[data-id]').forEach(function(li){li.onclick=function(){followId(li.dataset.id)}});
      if(l.length){if(!FOLLOWING)followId(l[0].id);setTimeout(loadRuns,20000)}
    }catch(e){ul.innerHTML='<li><span class="t">Serviço indisponível.</span></li>'}
  }
  // casos
  async function loadCases(){
    var ul=$('cases');
    try{var r=await api('/cases');var l=await r.json();
      ul.innerHTML=l.map(function(d){return '<li data-id="'+d.id+'"><div><div class="t">'+d.id+'</div><div class="s">'+(d.updated?new Date(d.updated).toLocaleString('pt-BR'):'')+'</div></div><span class="pill q">abrir</span></li>'}).join('')||'<li><span class="t">Nenhum caso ainda.</span></li>';
      ul.querySelectorAll('li[data-id]').forEach(function(li){li.onclick=function(){openCase(li.dataset.id)}});
    }catch(e){ul.innerHTML='<li><span class="t">Serviço indisponível.</span></li>'}
  }
  async function openCase(id,tries){tries=tries||0;
    var v=$('view');v.hidden=false;if(!tries){v.innerHTML='<h2>Carregando '+id+'…</h2>';v.scrollIntoView({behavior:'smooth'})}
    try{var r=await api('/cases/'+id);if(r.status===404&&tries<8){setTimeout(function(){openCase(id,tries+1)},4000);return}if(!r.ok)throw 0;var c=await r.json();
      var res=c.result,au=c.audit||{},m=c.metrics||{},tk=(m.tokens||{});
      var hyps=(res.hypotheses||[]).filter(function(h){return h&&String(h.statement||'').trim()}).map(function(h,i){h.rank=i+1;return '<div class="hyp"><div class="rank">'+(h.rank||'')+'</div><div><p class="st">'+esc(h.statement)+'</p><p class="ev">'+esc(h.evidence)+'</p>'+(h.audit_note?'<p class="an">Auditor: '+esc(h.audit_note)+'</p>':'')+'</div><div class="conf"><div class="v">'+Math.round(100*(h.confidence||0))+'%</div><div class="l">confiança</div><div class="w">'+esc(h.weight||'')+'</div></div></div>'}).join('');
      var checks=(au.checks||[]).map(function(k){return '<li class="'+(k.reproduced?'ok':'no')+'">'+esc(k.claim)+'<br><span style="color:var(--midnight)">'+esc(k.found)+'</span></li>'}).join('');
      var ags=Object.keys(c.agents||{}).map(function(k){var a=c.agents[k],co=a.conclusion||{};return '<details><summary><b>'+k+'</b> · '+esc(a.role)+' · '+Math.round(100*(co.confidence||0))+'%</summary><p class="ev"><i>'+esc(a.hypothesis)+'</i></p><p class="ev">'+esc(co.finding)+'</p>'+(co.caveats?'<p class="hint">'+esc(co.caveats)+'</p>':'')+'</details>'}).join('');
      v.innerHTML='<div class="mono">caso '+id+'</div><h2 style="margin-top:6px">'+esc(c.question)+'</h2>'+
        '<div class="kpis"><div class="kpi"><div class="v">'+Object.keys(c.agents||{}).length+'</div><div class="l">investigadores</div></div><div class="kpi"><div class="v">'+(m.queries||0)+'</div><div class="l">consultas</div></div><div class="kpi"><div class="v">'+gb(m.bytes||0)+'</div><div class="l">lidos</div></div><div class="kpi"><div class="v">'+Math.round((m.seconds||0)/60)+' min</div><div class="l">tempo</div></div><div class="kpi"><div class="v">'+fmtTok((tk.input||0)+(tk.output||0))+'</div><div class="l">tokens</div></div></div>'+
        '<h2>Hipóteses ranqueadas</h2>'+hyps+
        '<div class="action"><div class="mono">ação</div><p>'+esc(res.action)+'</p></div>'+
        (res.discarded&&res.discarded.length?'<h2 style="margin-top:22px">Descartado com dado</h2><ul class="dis">'+res.discarded.map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>':'')+
        '<h2 style="margin-top:22px">Auditoria <span class="pill '+(au.approved?'ok':'no')+'">'+(au.approved?'aprovado':'devolvido')+'</span></h2><div class="audit"><ul>'+checks+'</ul>'+(au.caveats?'<p class="hint">'+esc(au.caveats)+'</p>':'')+'</div>'+
        '<h2 style="margin-top:22px">Investigadores</h2>'+ags+
        '<p class="hint" style="margin-top:16px"><button class="ghost" type="button" id="replay">Reassistir a execução</button></p>';
      $('replay').onclick=function(){replayCase(id,c)};
    }catch(e){v.innerHTML='<h2>Não consegui abrir o caso '+id+'.</h2>'}
  }

  // ---- execução ao vivo ----
  function liveView(){if(!live)live=new SwarmLive($('live'));$('live').hidden=false;return live}
  function followId(id){
    if(FOLLOWING===id)return;FOLLOWING=id;
    var lv=liveView();$('live').scrollIntoView({behavior:'smooth',block:'start'});
    lv.follow(async function(){var r=await api('/live/'+id);if(!r.ok)return null;return r.json()},function(snap){FOLLOWING=null;setTimeout(function(){loadCases();loadRuns();openCase(snap.id)},2500)});
  }
  async function replayCase(id,c){
    var lv=liveView();$('live').scrollIntoView({behavior:'smooth',block:'start'});
    var r=await api('/cases/'+id+'/events');var txt=await r.text();
    var evs=txt.split('\n').filter(Boolean).map(function(l){try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    lv.replay({id:id,question:c.question,agents:c.agents,metrics:c.metrics,result:c.result},evs,12);
  }
  var P=new URLSearchParams(location.search);
  if(P.get('live'))followId(P.get('live'));
  if(P.get('replay'))(async function(){var id=P.get('replay');var r=await api('/cases/'+id);if(r.ok)replayCase(id,await r.json())})();
  if(P.get('case'))openCase(P.get('case'));

  $('from').value='2026-05-01';$('to').value='2026-06-30';
  if(USER){loadPlaybooks();loadBrands();loadRuns();loadCases()}
})();
</script>
</body>
</html>
