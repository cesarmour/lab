# Swarm, by HYPR · configuração do motor
model: claude-sonnet-5-5
project: hypr-prod            # ou BQ_PROJECT no ambiente

# Tabelas que o orquestrador pode distribuir aos investigadores (nomes completos; * = prefixo)
tables:
  - hypr-prod.transactions.*
  - hypr-prod.places.*
  - hypr-prod.audiences.*
  - hypr-prod.performance.*
  - hypr-prod.surveys.*

# Orçamentos (governança por papel)
budgets:
  investigator_gb: 5        # bytes lidos por consulta, por investigador
  auditor_gb: 8
  max_investigators: 8      # por rodada

# Texto curto sobre os dados, injetado em todos os prompts. Ajuste à realidade das tabelas.
data_context: |
  transactions.*: itens de notas fiscais do varejo físico (dt, store_id, brand, sku, category, channel, qty, unit_price, discount).
  places.*: lojas e POIs (store_id, city, uf, region, channel, chain, geo_cell) e visitas (device, store_id, dt).
  audiences.*: catálogo de audiências e membros (audience, device), exposição a campanhas.
  performance.*: entrega e atenção das campanhas que rodam na rede HYPR (brand, dt/month, geo_cell, impressions, spend, attention_share).
  surveys.*: respostas de pesquisas askIQ (brand, wave, question, answer).
