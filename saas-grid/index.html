<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HYPR Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef2f6;--midnight:#1c262f;--steel:#78909c;--cyan:#3397b9;--line:rgba(28,38,47,.55);--font:"Urbanist",ui-sans-serif,system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--midnight);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  .brand{position:fixed;top:22px;left:24px;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.14em;font-weight:600;color:var(--steel);text-transform:uppercase}
  .brand img{height:16px;display:block;filter:invert(1) brightness(.25)}
  .stage{position:relative;width:min(92vw,1180px);aspect-ratio:16/8.6;max-height:78vh}
  canvas{position:absolute;inset:-20%;width:140%;height:140%;pointer-events:none}
  .line{position:absolute;background:var(--line);box-shadow:1px 0 0 rgba(255,80,60,.18)}
  .line.h{height:1px;left:0;box-shadow:0 1px 0 rgba(255,80,60,.18)}
  .line.v{width:1px;top:0}
  .node{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--midnight)}
  .item{position:absolute;opacity:0;transition:opacity .55s ease;pointer-events:none}
  .item.on{opacity:1}
  .item.box{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:0 7%;background:var(--iq);color:#fff;overflow:hidden}
  .item.box .iq-logo{display:block;height:1em;width:auto;overflow:visible;color:#fff;font-size:var(--lg,32px)}
  .item.box .word{margin-top:.55em;white-space:nowrap;font-size:calc(var(--lg,32px)*.58);font-weight:400;letter-spacing:-.01em;opacity:.95;line-height:1.1}
  .item.logobox{display:flex;align-items:center;justify-content:center;background:var(--midnight)}
  .item.logobox img{width:70%;display:block}
  .item.tint{background:var(--iq);opacity:0;}
  .item.tint.on{opacity:.32}
  .item.text{display:flex;align-items:flex-end;padding:clamp(10px,1.8vw,22px);font-size:clamp(14px,2vw,26px);font-weight:500;letter-spacing:-.01em;line-height:1.15;color:var(--midnight)}
  .item.text.big{align-items:center;justify-content:center;text-align:center;font-size:clamp(22px,3.4vw,46px);font-weight:500;letter-spacing:-.02em}
  @media (max-width:640px){.stage{width:96vw;aspect-ratio:16/9.6}.brand{top:16px;left:16px}}
</style>
</head>

    let k=0;for(let r=0;r<=ROWS;r++)for(let c=0;c<=COLS;c++){const n=nodes[k++];n.style.left=(cx[c]*W)+'px';n.style.top=(ry[r]*H)+'px';}
    if(pending)pending.forEach((it,i)=>{const e=items[i];e.style.left=(cx[it.c]*W)+'px';e.style.top=(ry[it.r]*H)+'px';e.style.width=((cx[it.c+it.cs]-cx[it.c])*W)+'px';const bw=(cx[it.c+it.cs]-cx[it.c])*W,bh=(ry[it.r+it.rs]-ry[it.r])*H;e.style.height=bh+'px';if(it.t==='box')e.style.setProperty('--lg',Math.min(bw*.11,bh*.2)+'px');});
  }
  function applyItems(s){
    items.forEach((e,i)=>{const it=s.items[i];e.classList.remove('on');if(!it){e.className='item';e.innerHTML='';return;}
      e.className='item '+it.t+(it.cls?' '+it.cls:'');
      if(it.ac)e.style.setProperty('--iq',it.ac);
      e.innerHTML=it.t==='box'?'<svg class="iq-logo" viewBox="'+it.vb+'" style="--iq-accent:rgba(255,255,255,.78)"><use href="#iq-'+it.iq+'"></use></svg><div class="word">'+it.word+'</div>'
        :it.t==='logobox'?'<img src="hypr-wordmark-white.svg" alt="HYPR">':it.t==='text'?it.txt:'';});
    pending=s.items;
  }
  function go(n){const s=scenes[n];from=cur;fromR=curR;to=cum(s.cols);toR=cum(s.rows);items.forEach(e=>e.classList.remove('on'));
    setTimeout(()=>{applyItems(s);layout(cur,curR);requestAnimationFrame(()=>items.forEach((e,i)=>{if(s.items[i])e.classList.add('on');}));},420);t0=performance.now();anim=true;}
  // globo wireframe
  const cv=document.getElementById('globe'),ctx=cv.getContext('2d');let DPR=1;
  function resize(){DPR=Math.min(2,devicePixelRatio||1);cv.width=cv.clientWidth*DPR;cv.height=cv.clientHeight*DPR;}
  resize();addEventListener('resize',()=>{resize();layout(cur,curR);});
  function globe(t){
    const W=cv.clientWidth,H=cv.clientHeight,cx=W/2,cy=H/2,R=Math.min(W,H)*.46;
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R);g.addColorStop(0,'rgba(51,151,185,.22)');g.addColorStop(1,'rgba(51,151,185,.08)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(51,151,185,.45)';ctx.lineWidth=1;
    const tilt=.35,rot=t*.12;
    const P=(lat,lon)=>{const x=Math.cos(lat)*Math.cos(lon+rot),y=Math.sin(lat),z=Math.cos(lat)*Math.sin(lon+rot);const y2=y*Math.cos(tilt)-z*Math.sin(tilt),z2=y*Math.sin(tilt)+z*Math.cos(tilt);return [cx+x*R,cy-y2*R,z2];};
    for(let i=1;i<6;i++){const lat=-Math.PI/2+i*Math.PI/6;ctx.beginPath();for(let j=0;j<=120;j++){const p=P(lat,j/120*Math.PI*2);ctx.globalAlpha=p[2]>0?.9:.25;if(j==0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}ctx.stroke();}
    for(let i=0;i<12;i++){const lon=i*Math.PI/6;ctx.beginPath();for(let j=0;j<=120;j++){const p=P(-Math.PI/2+j/120*Math.PI,lon);ctx.globalAlpha=p[2]>0?.9:.25;if(j==0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);}ctx.stroke();}
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  }
  function frame(now){
    if(anim){const p=Math.min(1,(now-t0)/DUR),e=ease(p);cur=from.map((v,i)=>v+(to[i]-v)*e);curR=fromR.map((v,i)=>v+(toR[i]-v)*e);if(p>=1)anim=false;}
    layout(cur,curR);globe(now/1000);requestAnimationFrame(frame);
  }
  applyItems(scenes[0]);layout(cur,curR);
  requestAnimationFrame(()=>items.forEach((e,i)=>{if(scenes[0].items[i])e.classList.add('on');}));
  requestAnimationFrame(frame);
  setInterval(()=>{idx=(idx+1)%scenes.length;go(idx);},3200);
})();
</script>
