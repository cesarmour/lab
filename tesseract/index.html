<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HYPR Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fafafa;--midnight:#1c262f;--slate:#536872;--steel:#78909c;--mist:#e5ebf2;--line:rgba(28,38,47,.18);--line-2:rgba(28,38,47,.42);--font:"Urbanist",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--midnight);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
       background:radial-gradient(70% 60% at 50% 45%,#ffffff 0%,var(--bg) 70%)}
  .brand{position:fixed;top:22px;left:24px;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.14em;font-weight:600;color:var(--steel);text-transform:uppercase}
  .brand .wm{height:16px;width:auto;display:block;color:var(--midnight)}
  .meta{position:fixed;top:24px;right:24px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--steel)}
  .hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--steel);text-transform:uppercase}
  .stage{position:relative;width:min(92vw,980px);aspect-ratio:1/1;max-height:80vh;max-width:80vh}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .pill{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;padding:9px 16px 10px;border-radius:999px;
    border:1px solid color-mix(in srgb,var(--iq) 70%,transparent);background:color-mix(in srgb,var(--iq) 6%,#fff);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--iq) 7%,transparent),0 8px 24px -16px rgba(28,38,47,.4);font-size:clamp(14px,1.8vw,22px);transition:opacity .6s;will-change:left,top}
  .pill.dim{opacity:.35;filter:saturate(.4)}
  .iq-logo{display:inline-block;height:1em;width:auto;overflow:visible;color:var(--midnight)}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:70%;padding:28px 0;background:radial-gradient(closest-side,rgba(250,250,250,.96) 55%,rgba(250,250,250,0) 100%)}
  .center .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#3397b9;text-transform:uppercase;margin-bottom:12px}
  .center .t{font-size:clamp(20px,3.4vw,40px);font-weight:400;letter-spacing:-.02em;line-height:1.15;transition:opacity .5s}
  .center .t.off{opacity:0}
  @media (max-width:640px){.stage{width:96vw;max-height:none;max-width:none}.brand{top:16px;left:16px}.meta{top:18px;right:16px}}
</style>
</head>

  const pills=IQ.map(q=>{const e=document.createElement('div');e.className='pill';e.style.setProperty('--iq',q.ac);
    e.innerHTML='<svg class="iq-logo" viewBox="'+q.vb+'" style="--iq-accent:'+q.ac+'"><use href="#iq-'+q.id+'"></use></svg>';stage.appendChild(e);return e;});
  // 16 vértices do hipercubo
  const V=[];for(let i=0;i<16;i++)V.push([(i&1?1:-1),(i&2?1:-1),(i&4?1:-1),(i&8?1:-1)]);
  const E=[];for(let i=0;i<16;i++)for(let b=0;b<4;b++){const j=i^(1<<b);if(i<j)E.push([i,j]);}
  const rot=(p,a,b,t)=>{const c=Math.cos(t),s=Math.sin(t),x=p[a],y=p[b];p[a]=c*x-s*y;p[b]=s*x+c*y;};
  function project(p){const q=p.slice();const d4=4.2,w=1/(d4-q[3]);let x=q[0]*w*d4*.62,y=q[1]*w*d4*.62,z=q[2]*w*d4*.62;const d3=9,k=1/(d3-z);return [x*k*d3,y*k*d3,z,w];}
  let W,H,DPR;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize();addEventListener('resize',resize);
  let active=0;
  setInterval(()=>{active=(active+1)%5;pills.forEach((e,i)=>e.classList.toggle('dim',active<4&&i!==active));},3200);
  function frame(now){
    const t=now/1000;const S=Math.min(W,H)*.33;
    const P=V.map(v=>{const p=v.slice();rot(p,0,3,t*.3);rot(p,1,3,t*.11);rot(p,0,2,.62);rot(p,1,2,.38);const r=project(p);return [W/2+r[0]*S,H/2+r[1]*S,r[2],r[3]];});
    ctx.clearRect(0,0,W,H);
    // arestas
    for(const [i,j] of E){const a=P[i],b=P[j];const depth=((a[3]+b[3])/2-0.19)/0.12;ctx.strokeStyle=`rgba(28,38,47,${(.12+.3*Math.max(0,Math.min(1,depth))).toFixed(3)})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    // nós
    P.forEach((p,i)=>{const q=IQ.find(x=>x.v===i);ctx.beginPath();ctx.arc(p[0],p[1],q?3.5:2.2,0,Math.PI*2);ctx.fillStyle=q?q.ac:'#1c262f';ctx.fill();
      if(q){ctx.beginPath();ctx.arc(p[0],p[1],9,0,Math.PI*2);ctx.strokeStyle=q.ac+'55';ctx.lineWidth=1;ctx.stroke();}});
    // pills coladas ao vértice, empurradas para fora do centro
    IQ.forEach((q,i)=>{const p=P[q.v];const dx=p[0]-W/2,dy=p[1]-H/2,L=Math.hypot(dx,dy)||1;const off=Math.min(W,H)*.07;pills[i].style.left=(p[0]+dx/L*off)+'px';pills[i].style.top=(p[1]+dy/L*off)+'px';});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
